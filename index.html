<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e9"><meta name="apple-mobile-web-app-capable" content="yes"><title>Ballpark Memories</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><header><div><p class="eyebrow">BALLPARK MEMORIES</p><h1>我的球賽</h1></div><button id="addBtn" class="round">＋</button></header><section class="hero"><span>2026 SEASON</span><strong id="gameCount">0</strong><small>場現場觀賽</small></section><section id="empty" class="empty"><div class="ball">⚾️</div><h2>開始記錄第一場球賽</h2><p>選一個日期，我們會幫你找到當天的 CPBL 比賽。</p><button id="startBtn">新增比賽</button></section><section id="games" class="games"></section><footer class="version">Ballpark Memories · V0.7.5</footer></main><dialog id="addDialog"><form method="dialog"><button class="close" value="cancel">×</button><p class="eyebrow">NEW GAME STORY</p><h2>你哪一天去看球？</h2><label>比賽日期<input id="gameDate" type="date" required></label><button id="findBtn" type="button">尋找當日 CPBL 比賽</button><div id="schedule"></div></form></dialog><section id="story" class="story" hidden><div class="storybar"><button id="backBtn">‹</button><span>GAME STORY</span><button id="storyClose">×</button></div><div id="storyHead"></div><div class="story-actions"><label class="media-btn">＋ 加入這場照片<input id="mediaInput" type="file" accept="image/*" multiple hidden></label><button id="timeSettingsBtn" class="time-settings" type="button">調整比賽時間</button></div><div id="photoPickHint" class="photo-pick-hint"></div><div id="mediaStatus" class="media-status"></div><div class="curation-tools"><span>精選管理</span><div><button id="resetCurationBtn" type="button">恢復預設</button><button id="clearCurationBtn" type="button">全不選</button></div></div><div class="story-tabs"><button class="story-tab active" data-mode="book">精選故事</button><button class="story-tab" data-mode="all">全部回憶</button></div><div id="mediaGrid" class="media-grid"></div><div id="storyEmpty" class="story-empty"><b>把這一天留在這裡</b><span>從照片圖庫一次多選這場比賽的照片。</span></div></section><dialog id="timeDialog"><form method="dialog"><button class="close" value="cancel">×</button><p class="eyebrow">GAME TIME</p><h2>比賽時間</h2><p class="dialog-note">開賽時間使用官方賽程；若取得官方比賽用時會自動套用。找不到時只需人工輸入比賽用時，系統會自動算出終場時間。</p><div class="official-start">官方開賽時間 <b id="officialStart"></b></div><label>比賽用時（分鐘）<input id="manualDuration" type="number" min="1" max="600" inputmode="numeric" placeholder="例如 185"></label><button id="saveTimeBtn" type="button">儲存並計算終場時間</button></form></dialog><div id="viewer" class="viewer" hidden><button id="viewerClose" class="viewer-close" aria-label="關閉">×</button><div id="viewerCount" class="viewer-count"></div><button id="viewerPrev" class="viewer-nav viewer-prev" aria-label="上一張">‹</button><div id="viewerStage" class="viewer-stage"></div><button id="viewerNext" class="viewer-nav viewer-next" aria-label="下一張">›</button></div><script type="module" src="./src/app.js"></script></body></html>
