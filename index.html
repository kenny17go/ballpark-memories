<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e9"><meta name="apple-mobile-web-app-capable" content="yes"><title>Ballpark Memories</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><header><div><p class="eyebrow">BALLPARK MEMORIES</p><h1>我的球賽</h1></div><button id="addBtn" class="round">＋</button></header><section class="hero"><span>2026 SEASON</span><strong id="gameCount">0</strong><small>場現場觀賽</small></section><section id="empty" class="empty"><div class="ball">⚾️</div><h2>開始記錄第一場球賽</h2><p>選一個日期，我們會幫你找到當天的 CPBL 比賽。</p><button id="startBtn">新增比賽</button></section><section id="games" class="games"></section><footer class="version">Ballpark Memories · V0.4.0</footer></main><dialog id="addDialog"><form method="dialog"><button class="close" value="cancel">×</button><p class="eyebrow">NEW GAME STORY</p><h2>你哪一天去看球？</h2><label>比賽日期<input id="gameDate" type="date" required></label><button id="findBtn" type="button">尋找當日 CPBL 比賽</button><div id="schedule"></div></form></dialog><section id="story" class="story" hidden><div class="storybar"><button id="backBtn">‹</button><span>GAME STORY</span><button id="storyClose">×</button></div><div id="storyHead"></div><div class="story-actions"><label class="media-btn">＋ 加入本機照片／影片<input id="mediaInput" type="file" accept="image/*,video/*" multiple hidden></label></div><div id="mediaStatus" class="media-status"></div><div id="mediaGrid" class="media-grid"></div><div id="storyEmpty" class="story-empty"><b>把這一天留在這裡</b><span>從照片圖庫選取這場比賽的照片或影片。</span></div></section><div id="viewer" class="viewer" hidden><button id="viewerClose" class="viewer-close" aria-label="關閉">×</button><div id="viewerCount" class="viewer-count"></div><button id="viewerPrev" class="viewer-nav viewer-prev" aria-label="上一張">‹</button><div id="viewerStage" class="viewer-stage"></div><button id="viewerNext" class="viewer-nav viewer-next" aria-label="下一張">›</button></div><script type="module" src="./src/app.js"></script></body></html>
