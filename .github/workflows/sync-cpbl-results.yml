name: Sync CPBL Results

on:
  workflow_dispatch:
  schedule:
    # 23:20 Taiwan time (UTC+8), after most evening games finish.
    - cron: "20 15 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build 2025 historical schedule from zxc22 venue archives
        run: python scripts/build_cpbl_schedule.py 2025
      - name: Sync official 2026 results
        run: python scripts/sync_cpbl_results.py 2026
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/schedule-2025.json data/results-2026.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule-2025.json data/results-2026.json
          git commit -m "data: sync CPBL seasons"
          git pull --rebase origin main
          git push
