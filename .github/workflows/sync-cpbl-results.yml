name: Sync CPBL Results

on:
  workflow_dispatch:
  schedule:
    - cron: "20 15 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync official CPBL results
        run: python scripts/sync_cpbl_results.py
      - name: Commit updated results
        run: |
          if git diff --quiet -- data/results-2026.json; then
            echo "No result changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results-2026.json
          git commit -m "data: sync CPBL official results"
          git push
