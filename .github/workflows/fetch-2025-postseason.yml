name: Fetch 2025 Postseason Official Data
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-2025-postseason.yml"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch official postseason details
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,http.cookiejar
          BASE="https://cpbl.com.tw"
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def req(url,data=None,headers=None):
              body=urllib.parse.urlencode(data).encode() if data else None
              r=urllib.request.Request(url,data=body,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*",**(headers or {})})
              with opener.open(r,timeout=30) as x:return x.read().decode("utf-8","ignore")
          html=req(BASE+"/schedule?KindCode=C")
          m=re.search(r'name="__RequestVerificationToken"[^>]*value="([^"]+)"',html)
          if not m: m=re.search(r"RequestVerificationToken['\"]?\\s*[:=]\\s*['\"]([^'\"]{20,})",html)
          if not m: raise RuntimeError("token not found")
          token=m.group(1)
          def post(ep,data):
              raw=req(BASE+ep,data,{"Content-Type":"application/x-www-form-urlencoded","X-Requested-With":"XMLHttpRequest","RequestVerificationToken":token,"Referer":BASE+"/schedule?KindCode=C"})
              return json.loads(raw)
          out={}
          for kind,prefix,count in [("E","2025-E",4),("C","2025-C",5)]:
              for sno in range(1,count+1):
                  x={}
                  box=post("/box/getlive",{"GameSno":str(sno),"KindCode":kind,"Year":"2025","PrevOrNext":"","PresentStatus":""})
                  curt=json.loads(box.get("CurtGameDetailJson") or "{}") if box.get("Success") else {}
                  out[f"{prefix}-{sno}"]={
                    "schedule":{k:x.get(k) for k in ["GameDate","GameDateTimeS","GameDateTimeE","FieldAbbe","VisitingTeamName","HomeTeamName","VisitingScore","HomeScore","GameDuringTime","WinningPitcherName","LoserPitcherName","MvpName"]},
                    "box":{k:curt.get(k) for k in ["AudienceCntBackend","AudienceCnt","CloserPitcherName","WinningPitcherName","LoserPitcherName","MvpName","GameDuringTime"]},
                    "pitchingCredits":[{"name":p.get("PitcherName"),"result":p.get("GameResult"),"save":p.get("IsSaveOK")} for p in json.loads(box.get("PitchingJson") or "[]") if p.get("GameResult") or str(p.get("IsSaveOK"))=="1"]
                  }
          open("data/postseason-official-2025.tmp.json","w").write(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/postseason-official-2025.tmp.json
          git commit -m "chore: fetch 2025 postseason official data"
          git push
