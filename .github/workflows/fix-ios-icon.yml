name: Fix iOS Icon
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-ios-icon.yml"
permissions:
  contents: write
jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install pillow
      - name: Convert icons to RGB PNG
        run: |
          python - <<'PY'
          from PIL import Image
          src = Image.open("icon-192.png").convert("RGB")
          for out, size in [("apple-touch-icon.png",180),("icon-192.png",192),("icon-512.png",512)]:
              im = src.resize((size,size), Image.Resampling.LANCZOS)
              im.save(out, "PNG", optimize=True)
          PY
      - name: Commit fixed icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          git commit -m "fix: convert app icons to RGB PNG" || exit 0
          git push
